spring.application.name=kosmo163_boot

server.port=80

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#-- DB 정보
spring.datasource.hikari.username=cns
spring.datasource.hikari.password=cns
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

#-- mybatis 설정(카멜케이스로 전환 / xml 파일들이 어디있는지 알려주기)
mybatis.configuration.map-underscore-to-camel-case=true
#-- config의 typealias를 대체하여 사용할 수 있음
#-- 단점 : 동일한 class이름이 있을 경우 에러가 발생한다. 
mybatis.type-aliases-package=com.google.app

#-- file관리(여러개의 파일을 받아 하나로 합쳐주는 역할)
## multipart 사용 여부
spring.servlet.multipart.enabled=true

## 파일 하나당 최대 크기 설정 제한
spring.servlet.multipart.max-file-size=10MB

## 총 파일의 최대 크기 설정 제한
spring.servlet.multipart.max-request-size=100MB

#-- 파일 저장 관리
app.upload.base=D:\\upload\\